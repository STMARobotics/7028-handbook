name: Build Handbook PDF

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc 3.1.9
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.9/pandoc-3.1.9-1-amd64.deb
          sudo dpkg -i pandoc-3.1.9-1-amd64.deb

      - name: Install XeLaTeX and Python YAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-fonts-extra python3-yaml

      - name: Build PDF
        run: bash build/build.sh

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: handbook-preview
          path: handbook.pdf
          retention-days: 30

      - name: Commit rebuilt handbook.pdf to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Handbook Bot"
          git config user.email "handbook-bot@7028robotics.com"
          git add -f handbook.pdf
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild handbook PDF [skip ci]"
            git push
          else
            echo "No handbook.pdf changes to commit."
          fi
